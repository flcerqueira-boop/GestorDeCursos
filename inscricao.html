<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição — Gestor de Cursos</title>
<meta name="description" content="Faça sua inscrição no curso. Dr. Felipe Cerqueira · OrtoFlix">
<meta property="og:title" content="🎓 Inscrições abertas — Dr. Felipe Cerqueira">
<meta property="og:description" content="Clique para se inscrever no curso. OrtoFlix">
<meta property="og:type" content="website">
<style>
body{margin:0;background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#e2e8f0;text-align:center;padding:24px}
.spinner{width:36px;height:36px;border:3px solid #2d3748;border-top-color:#f97316;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
// Pega o ID da URL: inscricao.html?id=XXXXX
const id = new URLSearchParams(window.location.search).get('id');
if(id){
  // Redireciona para o link com # que funciona
  window.location.replace('https://gestordecursos.ortoflix.com/#/inscricao/' + id);
} else {
  document.body.innerHTML = '<div><div style="font-size:48px;margin-bottom:16px">🔗</div><h2>Link inválido</h2><p style="color:#94a3b8">Verifique o link com o organizador.</p></div>';
}
</script>
</head>
<body>
<div>
  <div class="spinner"></div>
  <p style="color:#94a3b8">Redirecionando...</p>
</div>
</body>
</html>
