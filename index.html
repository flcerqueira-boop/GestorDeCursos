<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Cursos — OrtoFlix</title>
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestor de Cursos">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1f2937;--border:#2d3748;
  --text:#e2e8f0;--text2:#94a3b8;--accent:#f97316;--accent2:#ea580c;
  --green:#10b981;--blue:#3b82f6;--yellow:#f59e0b;--purple:#8b5cf6;
  --teal:#14b8a6;--red:#ef4444;--r:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
a{text-decoration:none}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .2s ease}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}

/* LOGIN */
#login-page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 20% 50%,rgba(249,115,22,.07) 0%,transparent 55%),var(--bg);z-index:100}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand .logo-icon{font-size:40px;margin-bottom:12px;display:block}
.login-brand h1{font-size:24px;margin-bottom:4px}
.login-brand p{color:var(--text2);font-size:14px}
.login-form{display:flex;flex-direction:column;gap:14px}
.inp-group{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0 14px;transition:border-color .15s}
.inp-group:focus-within{border-color:var(--accent)}
.inp-group span{font-size:17px;flex-shrink:0;color:var(--text2)}
.inp-group input{flex:1;background:none;border:none;outline:none;color:var(--text);padding:13px 0;font-size:15px}
.login-err{color:var(--red);font-size:13px;text-align:center;display:none}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:none;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#0ea472;transform:translateY(-1px)}
.btn-red{background:transparent;color:var(--red);border:1px solid var(--border)}
.btn-red:hover{border-color:var(--red)}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:16px;margin-top:6px}
.ico-btn{padding:6px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text2);transition:all .15s;display:inline-flex;font-size:14px}
.ico-btn:hover{border-color:var(--red);color:var(--red)}
.ico-btn.edit:hover{border-color:var(--blue);color:var(--blue)}
.ico-btn.confirm:hover{border-color:var(--green);color:var(--green)}

/* ── TELA DE CURSOS ── */
#cursos-page{min-height:100vh;padding:32px 24px;max-width:900px;margin:0 auto}
.cursos-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:12px}
.cursos-topbar h1{font-size:26px}
.cursos-topbar .sub{color:var(--text2);font-size:13px;margin-top:2px}
.cursos-section{margin-bottom:32px}
.cursos-section h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.curso-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:10px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .15s}
.curso-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.curso-card.ativo{border-left:3px solid var(--green)}
.curso-card.encerrado{border-left:3px solid var(--border);opacity:.7}
.curso-card-icon{font-size:32px;flex-shrink:0}
.curso-card-info{flex:1}
.curso-card-info h3{font-size:16px;font-weight:700;margin-bottom:4px}
.curso-card-info p{font-size:13px;color:var(--text2)}
.curso-card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.curso-status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status-ativo{background:rgba(16,185,129,.12);color:var(--green)}
.status-encerrado{background:rgba(148,163,184,.1);color:var(--text2)}
.curso-card-actions{display:flex;gap:6px;flex-shrink:0}

/* ── APP LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-brand{padding:16px 18px;border-bottom:1px solid var(--border)}
.sb-curso-nome{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-curso-status{font-size:11px;color:var(--text2)}
.sb-back{display:flex;align-items:center;gap:6px;padding:8px 10px;margin:10px 10px 0;border-radius:8px;color:var(--text2);background:none;border:1px solid var(--border);cursor:pointer;font-size:13px;width:calc(100% - 20px);transition:all .15s}
.sb-back:hover{border-color:var(--accent);color:var(--accent)}
.sb-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text2);background:none;border:none;cursor:pointer;font-size:14px;font-weight:500;width:100%;transition:all .15s;text-align:left;position:relative}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:rgba(249,115,22,.15);color:var(--accent)}
.nav-btn .ico{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:auto}
.sb-foot{padding:14px;border-top:1px solid var(--border)}
.sb-email{display:block;font-size:11px;color:var(--text2);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;overflow-y:auto}

/* PAGE */
.page{padding:28px 32px;max-width:1100px;animation:fadeIn .2s ease}
.page-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.page-hdr h1{font-size:24px}
.page-hdr p{color:var(--text2);font-size:13px;margin-top:3px}
.hdr-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:13px}
.stat-ico{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.c-blue .stat-ico{background:rgba(59,130,246,.12);color:var(--blue)}
.c-green .stat-ico{background:rgba(16,185,129,.12);color:var(--green)}
.c-yellow .stat-ico{background:rgba(245,158,11,.12);color:var(--yellow)}
.c-orange .stat-ico{background:rgba(249,115,22,.12);color:var(--accent)}
.c-purple .stat-ico{background:rgba(139,92,246,.12);color:var(--purple)}
.c-teal .stat-ico{background:rgba(20,184,166,.12);color:var(--teal)}
.c-red .stat-ico{background:rgba(239,68,68,.12);color:var(--red)}
.stat-val{display:block;font-size:19px;font-weight:700;font-family:'Syne',sans-serif}
.stat-lbl{display:block;font-size:12px;color:var(--text2);margin-top:1px}
.balance{padding:8px 16px;border-radius:8px;font-weight:700;font-family:'Syne',sans-serif;font-size:14px}
.balance.pos{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.balance.neg{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.total-tag{padding:8px 16px;border-radius:8px;font-weight:700;font-family:'Syne',sans-serif;font-size:14px;background:rgba(249,115,22,.1);color:var(--accent);border:1px solid rgba(249,115,22,.2)}

/* TABLE */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead{background:var(--bg3)}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);color:var(--text)}
tr:hover td{background:rgba(255,255,255,.02)}
.empty-row{text-align:center;color:var(--text2);padding:48px!important}

/* BADGES */
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:rgba(16,185,129,.12);color:var(--green)}
.b-blue{background:rgba(59,130,246,.12);color:var(--blue)}
.b-yellow{background:rgba(245,158,11,.12);color:var(--yellow)}
.b-orange{background:rgba(249,115,22,.12);color:var(--accent)}
.b-purple{background:rgba(139,92,246,.12);color:var(--purple)}
.b-teal{background:rgba(20,184,166,.12);color:var(--teal)}
.b-red{background:rgba(239,68,68,.12);color:var(--red)}

/* STATUS SELECT */
.sts-sel{padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;outline:none;background:var(--bg3);color:var(--text)}
.sts-pago_pix{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.2)}
.sts-pago_cartao{background:rgba(59,130,246,.1);color:var(--blue);border-color:rgba(59,130,246,.2)}
.sts-aguard_confirm{background:rgba(245,158,11,.1);color:var(--yellow);border-color:rgba(245,158,11,.2)}
.sts-pgto_parcial{background:rgba(249,115,22,.1);color:var(--accent);border-color:rgba(249,115,22,.2)}
.sts-cortesia{background:rgba(139,92,246,.1);color:var(--purple);border-color:rgba(139,92,246,.2)}
.sts-cancelado{background:rgba(239,68,68,.1);color:var(--red);border-color:rgba(239,68,68,.2)}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0 12px;flex:1;min-width:200px}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{background:none;border:none;outline:none;color:var(--text);padding:10px 0;width:100%;font-size:14px}
.filter-sel{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;outline:none}

/* LINK CARD */
.link-card{display:flex;align-items:center;gap:20px;background:var(--bg2);border:1px solid rgba(249,115,22,.25);border-radius:var(--r);padding:18px 22px;margin-bottom:22px;flex-wrap:wrap}
.link-info{flex:1;display:flex;flex-direction:column;gap:8px;min-width:180px}
.link-lbl{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.link-url{font-size:13px;color:var(--accent);background:rgba(249,115,22,.07);padding:8px 12px;border-radius:6px;word-break:break-all;font-family:monospace}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 48px rgba(0,0,0,.6)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h2{font-size:19px;margin:0}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:0;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}
select option{background:var(--bg3)}

/* GASTOS */
.gastos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gasto-cat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.gasto-cat-hdr{display:flex;justify-content:space-between;padding:13px 16px;background:var(--bg3);border-bottom:1px solid var(--border)}
.gasto-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid var(--border)}

/* CONFIG */
.config-sections{display:flex;flex-direction:column;gap:22px}
.config-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.config-sec h2{font-size:15px;margin-bottom:18px;padding-bottom:11px;border-bottom:1px solid var(--border);color:var(--text2)}

/* NOTIF */
.notif-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.notif-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.notif-item.nova{border-left:3px solid var(--accent)}
.notif-item.pagamento{border-left:3px solid var(--green)}
.notif-title{font-weight:700;font-size:14px;margin-bottom:4px}
.notif-sub{font-size:13px;color:var(--text2)}

/* EMPTY */
.empty{text-align:center;padding:56px 20px;color:var(--text2)}
.empty .ico{font-size:48px;opacity:.3;margin-bottom:14px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:10px;font-size:14px;z-index:9999;animation:fadeIn .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:300px}
.toast.ok{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.4);color:var(--red)}

/* PUBLIC PAGE */
#public-page{min-height:100vh;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;background-image:radial-gradient(ellipse at 20% 0%,rgba(249,115,22,.08) 0%,transparent 50%)}
.pub-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:580px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.pub-hdr{padding:30px;background:linear-gradient(135deg,rgba(249,115,22,.1),rgba(59,130,246,.06));border-bottom:1px solid var(--border);text-align:center}
.pub-hdr h1{font-size:22px;color:var(--text);margin-bottom:8px}
.pub-desc{color:var(--text2);font-size:14px;margin-bottom:14px}
.pub-meta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--text2)}
.pub-form{padding:26px}
.radio-group{display:flex;gap:10px;flex-wrap:wrap;padding:2px 0}
.radio-opt{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px;color:var(--text);padding:8px 13px;border:1px solid var(--border);border-radius:8px;transition:all .15s}
.radio-opt.selected{border-color:var(--accent);background:rgba(249,115,22,.08);color:var(--accent)}

/* CONFIRM */
.confirm-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;padding:38px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.confirm-ico{font-size:54px;margin-bottom:14px}
.confirm-card h1{font-size:24px;margin-bottom:10px}
.pix-box{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:var(--r);padding:18px;margin:16px 0;text-align:left}
.pix-box-hdr{font-weight:700;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pix-key-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pix-key-row code{flex:1;background:var(--bg3);padding:8px 12px;border-radius:6px;font-size:13px;word-break:break-all}
.cartao-box{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:18px;margin:16px 0}
.aviso-pgto-box{background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.2);border-radius:var(--r);padding:20px;margin:20px 0;text-align:left}
.aviso-pgto-box h3{font-size:15px;margin-bottom:12px;color:var(--accent)}
.info-box{margin-top:16px;background:var(--bg3);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text2);text-align:left}

/* RESPONSIVE */
@media(max-width:700px){
  #app{flex-direction:column;height:100vh}
  .sidebar{width:100%;height:auto;flex-shrink:0;border-right:none;border-bottom:1px solid var(--border)}
  .sb-brand{display:none}
  .sb-back{display:none}
  .sb-nav-back{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:10px 8px;color:var(--text2);background:none;border:none;border-right:1px solid var(--border);cursor:pointer;font-size:10px;font-weight:600;min-width:52px;transition:color .15s}
  .sb-nav-back:hover{color:var(--accent)}
  .sb-foot{display:none}
  .sb-nav{flex-direction:row;overflow-x:auto;padding:0;gap:0}
  .nav-btn{flex-direction:column;gap:3px;padding:10px 6px;border-radius:0;flex:1;justify-content:center;min-width:52px;font-size:10px}
  .nav-btn .ico{font-size:20px;width:auto}
  .nav-btn span{display:block;font-size:10px;line-height:1}
  .nav-btn.active{background:rgba(249,115,22,.12);border-bottom:2px solid var(--accent)}
  .nav-badge{position:absolute;top:6px;right:6px;padding:1px 5px}
  .nav-btn{position:relative}
  .main{flex:1;overflow-y:auto}
  .page{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:1}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .overlay{padding:12px;align-items:flex-end}
  .modal{border-radius:14px 14px 0 0;max-height:85vh;padding:20px}
  .toast{bottom:80px;right:12px;left:12px;max-width:none;text-align:center}
  #cursos-page{padding:20px 16px}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:var(--text2);font-size:14px;margin-top:8px">Carregando...</p>
</div>

  <div class="login-card">
    <div class="login-brand">
      <span class="logo-icon">🎓</span>
      <h1>Gestor de Cursos</h1>
      <p>Painel administrativo · OrtoFlix</p>

      <div class="inp-group"><span>✉️</span><input type="email" id="login-email" placeholder="Email"/></div>

  <div class="cursos-topbar">

      <h1>🎓 Gestor de Cursos</h1>

<!-- APP (painel do curso) -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-curso-nome" id="sb-curso-nome">Curso</div>
      <div class="sb-curso-status" id="sb-curso-status"></div>
    </div>
    <button class="sb-back" onclick="voltarParaCursos()">← Voltar aos cursos</button>
    <nav class="sb-nav">
      <button class="sb-nav-back" onclick="voltarParaCursos()"><span style="font-size:18px">←</span><span>Cursos</span></button>

      <button class="nav-btn" data-page="notificacoes" onclick="goTo('notificacoes')" id="nav-notif"><span class="ico">🔔</span><span>Notificações</span></button>
      <button class="nav-btn" data-page="inscricoes" onclick="goTo('inscricoes')"><span class="ico">👥</span><span>Inscrições</span></button>
      <button class="nav-btn" data-page="gastos" onclick="goTo('gastos')"><span class="ico">💰</span><span>Gastos</span></button>

    </nav>
    <div class="sb-foot">
      <span class="sb-email" id="sb-email"></span>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="voltarParaCursos()">← Cursos</button>
    </div>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<div id="public-page" class="hidden"></div>

<script>
// ══════════════════════════
// FIREBASE + EMAILJS
// ══════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAq9ix8gVMn8lr7xtx49yUCDDI4fnpUuiI",
  authDomain: "cursomanager-53218.firebaseapp.com",
  projectId: "cursomanager-53218",
  storageBucket: "cursomanager-53218.firebasestorage.app",
  messagingSenderId: "250558746109",
  appId: "1:250558746109:web:ed58b1388c7940103ddd94"
};
firebase.initializeApp(firebaseConfig);
const db   = firebase.firestore();
const auth = firebase.auth();
emailjs.init('FjaSDa-O3hhpVQ2mJ');
const EJ_SERVICE   = 'service_pdplefb';
const EJ_TMPL_INSC = 'template_803p8n1';
const EJ_TMPL_PGTO = 'template_ohy2woh';
function sendEmail(t,p){ return emailjs.send(EJ_SERVICE,t,p).catch(e=>console.warn('EmailJS:',e)); }

// ══════════════════════════
// STATE
// ══════════════════════════
let cursoAtivo = null;       // objeto do curso selecionado
let cursoAtivoId = null;     // ID do curso selecionado
let inscricoes = [];
let gastos = [];
let notificacoes = [];
let cursos = [];
let unsubInsc, unsubNotif, unsubCursoAtivo;
let currentPage = '';

// ══════════════════════════
// HELPERS
// ══════════════════════════
function show(id){ document.getElementById(id).classList.remove('hidden') }
function hide(id){ document.getElementById(id).classList.add('hidden') }
function toast(msg, type='ok'){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className=`toast ${type}`; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function fmtBRL(v){ return 'R$ '+(parseFloat(v)||0).toFixed(2).replace('.',',') }
function fmtDate(ts){ if(!ts) return '-'; const d=ts.toDate?ts.toDate():new Date(ts); return d.toLocaleDateString('pt-BR'); }
function statusLabel(s){ return {pago_pix:'Pago PIX',pago_cartao:'Pago Cartão',aguard_confirm:'Aguard. Confirmação',pgto_parcial:'Pgto. Parcial',cortesia:'Cortesia',cancelado:'Cancelado'}[s]||s }
function statusClass(s){ return {pago_pix:'b-green',pago_cartao:'b-blue',aguard_confirm:'b-yellow',pgto_parcial:'b-orange',cortesia:'b-purple',cancelado:'b-red'}[s]||'' }
function statusColor(s){ return {pago_pix:'#d1fae5',pago_cartao:'#dbeafe',aguard_confirm:'#fef3c7',pgto_parcial:'#ffedd5',cortesia:'#ede9fe',cancelado:'#fee2e2'}[s]||'#f3f4f6' }
function closeModal(){ document.querySelectorAll('.overlay').forEach(o=>o.remove()); }
function closeIfOverlay(e){ if(e.target.classList.contains('overlay')) closeModal(); }
function copyText(txt){ navigator.clipboard.writeText(txt).then(()=>toast('Copiado!')); }

// ══════════════════════════
// ROUTE DETECTION
// ══════════════════════════
const hashNow = window.location.hash;
const isPublic  = hashNow.startsWith('#/inscricao/');
const isAvisar  = hashNow.startsWith('#/avisar/');
const isErroCurso = hashNow === '#/inscricao';

// ══════════════════════════
// AUTH
// ══════════════════════════
auth.onAuthStateChanged(user=>{
  hide('loading-screen');
  if(isPublic){ showPublicPage(); return; }
  if(isAvisar){ showAvisarPage(); return; }
  if(isErroCurso){ showErroCurso(); return; }
  if(user){
    document.getElementById('sb-email').textContent = user.email;
    document.getElementById('user-email-cursos').textContent = user.email;
    carregarCursos();
  } else { show('login-page'); }
});

function doLogin(){
  const email = document.getElementById('login-email').value;
  const pass  = document.getElementById('login-pass').value;
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('login-err');
  btn.textContent='Entrando...'; btn.disabled=true; err.style.display='none';
  const timeout = setTimeout(()=>{
    btn.textContent='Entrar'; btn.disabled=false;
    err.textContent='Conexão lenta. Tente novamente.'; err.style.display='block';
  }, 10000);
  auth.signInWithEmailAndPassword(email, pass)
    .then(()=>{ clearTimeout(timeout); })
    .catch(()=>{ clearTimeout(timeout); err.textContent='Email ou senha incorretos'; err.style.display='block'; btn.textContent='Entrar'; btn.disabled=false; });
}
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && !document.getElementById('login-page').classList.contains('hidden')) doLogin(); });

function doLogout(){
  auth.signOut();
  [unsubInsc,unsubNotif,unsubCursoAtivo].forEach(u=>u&&u());
  hide('app'); hide('cursos-page'); show('login-page');
}

// ══════════════════════════
// TELA DE CURSOS
// ══════════════════════════
async function carregarCursos(){
  hide('app'); hide('login-page');
  show('cursos-page');
  db.collection('cursos').onSnapshot(snap=>{
    cursos = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
    renderCursos();
  });
}

function renderCursos(){
  const ativos    = cursos.filter(c=>c.status!=='encerrado');
  const encerrados = cursos.filter(c=>c.status==='encerrado');
  const list = document.getElementById('cursos-list');

  let html = '';
  if(ativos.length){
    html += `<div class="cursos-section"><h2>Cursos Ativos</h2>`;
    html += ativos.map(c=>cursoCardHTML(c)).join('');
    html += `</div>`;
  }
  if(encerrados.length){
    html += `<div class="cursos-section"><h2>Cursos Encerrados</h2>`;
    html += encerrados.map(c=>cursoCardHTML(c)).join('');
    html += `</div>`;
  }
  if(!cursos.length){
    html = `<div class="empty"><div class="ico">🎓</div><p>Nenhum curso cadastrado ainda.<br>Clique em <strong>Novo Curso</strong> para começar.</p></div>`;
  }
  list.innerHTML = html;
}

function cursoCardHTML(c){
  const isAtivo = c.status !== 'encerrado';
  return `
  <div class="curso-card ${isAtivo?'ativo':'encerrado'}" onclick="abrirCurso('${c.id}')">
    <div class="curso-card-icon">🎓</div>
    <div class="curso-card-info">
      <h3>${c.nome||'Sem nome'}</h3>
      <p>${[c.data,c.local].filter(Boolean).join(' · ')||'Sem data/local definido'}</p>
      <div class="curso-card-meta">
        <span class="curso-status-badge ${isAtivo?'status-ativo':'status-encerrado'}">${isAtivo?'Ativo':'Encerrado'}</span>
        ${c.vagas?`<span style="font-size:12px;color:var(--text2)">${c.vagas} vagas</span>`:''}
      </div>
    </div>
    <div class="curso-card-actions" onclick="event.stopPropagation()">
      <button class="ico-btn edit" onclick="openEditCursoStatus('${c.id}','${c.status||'ativo'}')" title="Alterar status">⚙️</button>
      <button class="ico-btn" onclick="deletarCurso('${c.id}')" title="Excluir">🗑️</button>
    </div>
  </div>`;
}

function openNovoCurso(){
  document.body.insertAdjacentHTML('beforeend',`
  <div class="overlay" onclick="closeIfOverlay(event)">
    <div class="modal">
      <div class="modal-header"><h2>Novo Curso</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="form-grid">
        <div class="field full"><label>Nome do Curso *</label><input id="nc-nome" placeholder="Ex: Treinamento em Exercícios Terapêuticos — 7ª Edição"/></div>
        <div class="field"><label>Data</label><input id="nc-data" placeholder="Ex: 29 e 30 de agosto de 2026"/></div>
        <div class="field"><label>Local</label><input id="nc-local" placeholder="Ex: Aracaju, SE"/></div>
        <div class="field"><label>Vagas</label><input id="nc-vagas" type="number" placeholder="40"/></div>
        <div class="field full"><label>Descrição (aparece na página pública)</label><textarea id="nc-desc"></textarea></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarNovoCurso()">Criar Curso</button>
      </div>
    </div>
  </div>`);
}

async function salvarNovoCurso(){
  const nome = document.getElementById('nc-nome').value.trim();
  if(!nome){ toast('Preencha o nome do curso','err'); return; }
  try{
    const ref = await db.collection('cursos').add({
      nome, data: document.getElementById('nc-data').value.trim(),
      local: document.getElementById('nc-local').value.trim(),
      vagas: parseInt(document.getElementById('nc-vagas').value)||0,
      descricao: document.getElementById('nc-desc').value.trim(),
      status: 'ativo',
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      chavePix:'', nomePix:'', linkCartao:'', linkCartaoFid:'',
      vAvista:0, vPix3x:0, pixP1:0, pixP2:0, pixP3:0, vCartao:0,
      fAvista:0, fPix3x:0, fCartao:0,
      regrasPix:'', regrasCancel:''
    });
    toast('Curso criado!');
    closeModal();
    abrirCurso(ref.id);
  } catch(e){ toast('Erro ao criar curso','err'); }
}

function openEditCursoStatus(id, statusAtual){
  document.body.insertAdjacentHTML('beforeend',`
  <div class="overlay" onclick="closeIfOverlay(event)">
    <div class="modal" style="max-width:340px">
      <div class="modal-header"><h2>Status do Curso</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="field">
        <label>Status</label>
        <select id="edit-curso-status">
          <option value="ativo" ${statusAtual==='ativo'?'selected':''}>Ativo</option>
          <option value="encerrado" ${statusAtual==='encerrado'?'selected':''}>Encerrado</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarStatusCurso('${id}')">Salvar</button>
      </div>
    </div>
  </div>`);
}

async function salvarStatusCurso(id){
  const status = document.getElementById('edit-curso-status').value;
  await db.collection('cursos').doc(id).update({status});
  toast('Status atualizado!');
  closeModal();
}

async function deletarCurso(id){
  if(!confirm('Excluir este curso e todos os seus dados? Esta ação não pode ser desfeita.')) return;
  // Delete subcollections
  const cols = ['inscricoes','gastos','notificacoes'];
  for(const col of cols){
    const snap = await db.collection('cursos').doc(id).collection(col).get();
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }
  await db.collection('cursos').doc(id).delete();
  toast('Curso excluído');
}

// ══════════════════════════
// ABRIR CURSO
// ══════════════════════════
function abrirCurso(id){
  // Limpa listeners anteriores
  [unsubInsc,unsubNotif,unsubCursoAtivo].forEach(u=>u&&u());

  cursoAtivoId = id;
  hide('cursos-page');
  show('app');

  // Listener do curso ativo
  unsubCursoAtivo = db.collection('cursos').doc(id).onSnapshot(snap=>{
    cursoAtivo = snap.exists ? {id:snap.id,...snap.data()} : null;
    if(cursoAtivo){
      document.getElementById('sb-curso-nome').textContent = cursoAtivo.nome||'Curso';
      document.getElementById('sb-curso-status').textContent = cursoAtivo.status==='encerrado'?'Encerrado':'Ativo';
    }
    if(currentPage==='dashboard') renderDashboard();
    if(currentPage==='config') renderConfig();
  });

  // Inscrições
  unsubInsc = db.collection('cursos').doc(id).collection('inscricoes').onSnapshot(snap=>{
    inscricoes = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
    if(currentPage==='inscricoes') renderInscricoes();
    if(currentPage==='dashboard') renderDashboard();
  });

  // Notificações
  unsubNotif = db.collection('cursos').doc(id).collection('notificacoes').onSnapshot(snap=>{
    notificacoes = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0));
    updateNotifBadge();
    if(currentPage==='notificacoes') renderNotificacoes();
  });

  // Gastos (uma vez)
  db.collection('cursos').doc(id).collection('gastos').get().then(snap=>{
    gastos = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentPage==='gastos') renderGastos();
    if(currentPage==='dashboard') renderDashboard();
  });

  goTo('dashboard');
}

function voltarParaCursos(){
  [unsubInsc,unsubNotif,unsubCursoAtivo].forEach(u=>u&&u());
  cursoAtivo = null; cursoAtivoId = null;
  inscricoes = []; gastos = []; notificacoes = [];
  hide('app');
  show('cursos-page');
}

// ══════════════════════════
// NAVIGATION
// ══════════════════════════
function goTo(page){
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  if(page==='gastos'){ reloadGastos(renderGastos); }
  else { ({dashboard:renderDashboard, notificacoes:renderNotificacoes, inscricoes:renderInscricoes, config:renderConfig})[page]?.(); }
}

function reloadGastos(cb){
  db.collection('cursos').doc(cursoAtivoId).collection('gastos').get().then(snap=>{
    gastos = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(cb) cb();
  });
}

function updateNotifBadge(){
  const n = notificacoes.filter(n=>!n.lida).length;
  const nav = document.getElementById('nav-notif');
  if(!nav) return;
  nav.querySelector('.nav-badge')?.remove();
  if(n>0){ const b=document.createElement('span'); b.className='nav-badge'; b.textContent=n; nav.appendChild(b); }
}

// ══════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════
function renderDashboard(){
  const c = cursoAtivo||{};
  const pagos   = inscricoes.filter(i=>i.status==='pago_pix'||i.status==='pago_cartao'||i.status==='cortesia');
  const aguard  = inscricoes.filter(i=>i.status==='aguard_confirm');
  const parcial = inscricoes.filter(i=>i.status==='pgto_parcial');
  const totalG  = gastos.reduce((s,g)=>s+(g.valor||0),0);
  const receitaBruta = inscricoes.reduce((s,i)=>s+(i.valorFinal||0),0);
  const receitaLiq = inscricoes.reduce((s,i)=>{
    const isCartao=(i.formaPagamento||'').includes('Cartão');
    const isPix3x=(i.formaPagamento||'').toLowerCase().includes('pix parcelado')||(i.formaPagamento||'').includes('3x');
    if(isCartao) return s+(i.valorLiquido||0);
    if(isPix3x)  return s+(i.valorPago||0);
    return s+(i.valorPago||0);
  },0);
  const saldo = receitaLiq - totalG;
  const naoLidas = notificacoes.filter(n=>!n.lida).length;

  document.getElementById('main-content').innerHTML = `
  <div class="page fade-in">
    <div class="page-hdr">
      <div>
        <h1>${c.nome||'Curso sem nome'}</h1>
        <p>${[c.data,c.local].filter(Boolean).join(' · ')||''}</p>
      </div>
      <div class="${saldo>=0?'balance pos':'balance neg'}">
        Saldo: ${fmtBRL(saldo)}
      </div>
    </div>

    ${naoLidas>0?`<div style="background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.25);border-radius:var(--r);padding:14px 18px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <span>🔔 <strong>${naoLidas}</strong> notificação(ões) não lida(s)</span>
      <button class="btn btn-outline btn-sm" onclick="goTo('notificacoes')">Ver</button>
    </div>`:''}

    <div class="stats-grid">
      <div class="stat c-blue"><div class="stat-ico">👥</div><div><span class="stat-val">${inscricoes.length}</span><span class="stat-lbl">Total Inscritos</span></div></div>
      <div class="stat c-green"><div class="stat-ico">✅</div><div><span class="stat-val">${pagos.length}</span><span class="stat-lbl">Confirmados</span></div></div>
      <div class="stat c-yellow"><div class="stat-ico">⏳</div><div><span class="stat-val">${aguard.length}</span><span class="stat-lbl">Aguard. Confirmação</span></div></div>
      <div class="stat c-orange"><div class="stat-ico">💰</div><div><span class="stat-val">${parcial.length}</span><span class="stat-lbl">Pgto. Parcial</span></div></div>
      <div class="stat c-teal"><div class="stat-ico">📊</div><div><span class="stat-val">${fmtBRL(receitaBruta)}</span><span class="stat-lbl">Receita Bruta</span></div></div>
      <div class="stat c-blue"><div class="stat-ico">💳</div><div><span class="stat-val">${fmtBRL(receitaLiq)}</span><span class="stat-lbl">Receita Líquida</span></div></div>
      <div class="stat c-red"><div class="stat-ico">💸</div><div><span class="stat-val">${fmtBRL(totalG)}</span><span class="stat-lbl">Total Gastos</span></div></div>
    </div>

    ${inscricoes.length?`
    <h3 style="margin-bottom:14px;color:var(--text2);font-size:15px">Últimas inscrições</h3>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Nome</th><th>Pagamento</th><th>Valor</th><th>Status</th></tr></thead>
      <tbody>${[...inscricoes].sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0)).slice(0,5).map(i=>`
      <tr>
        <td><strong>${i.nome}</strong></td>
        <td>${i.formaPagamento||'-'}</td>
        <td>${fmtBRL(i.valorFinal)}</td>
        <td><span class="badge ${statusClass(i.status)}">${statusLabel(i.status)}</span></td>
      </tr>`).join('')}</tbody>
    </table></div>`:'<div class="empty"><div class="ico">📋</div><p>Nenhuma inscrição ainda.</p></div>'}
  </div>`;
}

// ══════════════════════════════════════════════════════
// NOTIFICAÇÕES
// ══════════════════════════════════════════════════════
function renderNotificacoes(){
  notificacoes.filter(n=>!n.lida).forEach(n=>{
    db.collection('cursos').doc(cursoAtivoId).collection('notificacoes').doc(n.id).update({lida:true});
  });
  document.getElementById('main-content').innerHTML = `
  <div class="page fade-in">
    <div class="page-hdr">
      <div><h1>Notificações</h1><p>${notificacoes.length} no total</p></div>
      ${notificacoes.length?`<button class="btn btn-outline btn-sm" onclick="limparNotif()">🗑️ Limpar todas</button>`:''}
    </div>
    ${notificacoes.length===0?'<div class="empty"><div class="ico">🔔</div><p>Nenhuma notificação ainda.</p></div>':''}
    <div class="notif-list">
      ${notificacoes.map(n=>`
      <div class="notif-item ${n.tipo}">
        <div style="flex:1">
          <div class="notif-title">${n.tipo==='nova'?'🎓 Nova inscrição':'💰 Aviso de pagamento'}: <strong>${n.nomeAluno}</strong></div>
          <div class="notif-sub">${n.detalhe||''}</div>
          ${n.tipo==='pagamento'&&n.inscricaoId?`
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-green btn-sm" onclick="confirmarPagamento('${n.inscricaoId}','${n.id}')">✅ Confirmar</button>

        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

async function confirmarPagamento(inscId, notifId){
  const insc = inscricoes.find(i=>i.id===inscId);
  if(!insc){ toast('Inscrição não encontrada','err'); return; }
  const novoStatus = insc.formaPagamento?.includes('Cartão')?'pago_cartao':'pago_pix';
  await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(inscId).update({status:novoStatus, valorPago:insc.valorFinal||0});
  await db.collection('cursos').doc(cursoAtivoId).collection('notificacoes').doc(notifId).delete();
  toast('Pagamento confirmado! ✅');
}
async function deletarNotif(id){ await db.collection('cursos').doc(cursoAtivoId).collection('notificacoes').doc(id).delete(); }
async function limparNotif(){
  if(!confirm('Limpar todas?')) return;
  const batch = db.batch();
  notificacoes.forEach(n=>batch.delete(db.collection('cursos').doc(cursoAtivoId).collection('notificacoes').doc(n.id)));
  await batch.commit(); toast('Notificações limpas');
}

function toggleLinkCard(){ document.getElementById('link-card-wrap')?.classList.toggle('hidden'); }
async function salvarLiquido(id,v){ await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).update({valorLiquido:parseFloat(v)||0}); toast('Valor líquido salvo!'); }
async function updateStatus(id,status,sel){
  sel.className=`sts-sel sts-${status}`;
  const insc=inscricoes.find(i=>i.id===id);
  const updates={status};
  const isPix3x=(insc?.formaPagamento||'').toLowerCase().includes('pix parcelado')||(insc?.formaPagamento||'').includes('3x');
  if((status==='pago_pix'||status==='pago_cartao')&&!isPix3x) updates.valorPago=insc?.valorFinal||0;
  await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).update(updates);
  toast('Status atualizado');
}
async function deleteInsc(id){ if(!confirm('Remover?')) return; await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).delete(); toast('Removido'); }

function openAddInsc(){ openInscModal(null); }
function openEditInsc(id){ openInscModal(inscricoes.find(i=>i.id===id)); }

async function saveInsc(id){
  const nome=document.getElementById('if-nome').value.trim();
  if(!nome){ toast('Preencha o nome','err'); return; }
  const data={
    nome, email:document.getElementById('if-email').value.trim(),
    telefone:document.getElementById('if-tel').value.trim(),
    instagram:document.getElementById('if-insta').value.trim(),
    perfil:document.getElementById('if-perfil').value,
    faculdade:document.getElementById('if-fac').value.trim(),
    formaPagamento:document.getElementById('if-pgto').value,
    fidelidade:document.getElementById('if-fid').value,
    valorFinal:parseFloat(document.getElementById('if-valor').value)||0,
    status:document.getElementById('if-status').value,
  };
  const isPix3x=data.formaPagamento.toLowerCase().includes('pix parcelado')||data.formaPagamento.includes('3x');
  if((data.status==='pago_pix'||data.status==='pago_cartao')&&!isPix3x) data.valorPago=data.valorFinal;
  try{
    if(id) await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).update(data);
    else await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').add({...data, criadoEm:firebase.firestore.FieldValue.serverTimestamp()});
    toast(id?'Atualizado!':'Adicionado!');
  } catch(e){ toast('Erro ao salvar','err'); }
  closeModal();
}

// ── PARCELAS ──
async function openParcelas(id){
  const insc=inscricoes.find(i=>i.id===id); if(!insc) return;
  const vTotal=insc.valorFinal||0, vPago=insc.valorPago||0, falta=Math.max(0,vTotal-vPago);
  const pagamentos=insc.pagamentos||[];
  document.body.insertAdjacentHTML('beforeend',`
  <div class="overlay" onclick="closeIfOverlay(event)">
    <div class="modal">
      <div class="modal-header"><h2>💰 Parcelas — ${insc.nome}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;text-align:center">
        <div style="background:var(--bg3);border-radius:8px;padding:12px"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">TOTAL</div><div style="font-weight:700;font-family:'Syne',sans-serif">${fmtBRL(vTotal)}</div></div>
        <div style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:12px"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">PAGO</div><div style="font-weight:700;font-family:'Syne',sans-serif;color:var(--green)">${fmtBRL(vPago)}</div></div>
        <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:12px"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">FALTA</div><div style="font-weight:700;font-family:'Syne',sans-serif;color:${falta>0?'var(--yellow)':'var(--green)'}">${falta>0?fmtBRL(falta):'✅ Quitado'}</div></div>
      </div>
      ${pagamentos.length?`<h3 style="font-size:14px;color:var(--text2);margin-bottom:10px">Histórico</h3><div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">${pagamentos.map((p,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-radius:7px;font-size:13px"><span>Parcela ${idx+1} — ${p.data}</span><div style="display:flex;align-items:center;gap:10px"><span style="font-weight:700;color:var(--green)">${fmtBRL(p.valor)}</span><button class="ico-btn" onclick="removerParcela('${id}',${idx})">🗑️</button></div></div>`).join('')}</div>`:''}
      ${falta>0?`
      <h3 style="font-size:14px;color:var(--text2);margin-bottom:12px">Lançar pagamento</h3>
      <div class="form-grid">
        <div class="field"><label>Valor (R$) *</label><input id="pp-valor" type="number" placeholder="150"/></div>
        <div class="field"><label>Data *</label><input id="pp-data" type="date" value="${new Date().toISOString().split('T')[0]}"/></div>
        <div class="field full"><label>Observação</label><input id="pp-obs" placeholder="Ex: 2ª parcela"/></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Fechar</button>
        <button class="btn btn-primary" onclick="lancarParcela('${id}',${vTotal})">Lançar</button>
      </div>`:`<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Fechar</button></div>`}
    </div>
  </div>`);
}

async function lancarParcela(id,vTotal){
  const valor=parseFloat(document.getElementById('pp-valor').value), data=document.getElementById('pp-data').value, obs=document.getElementById('pp-obs').value.trim();
  if(!valor||!data){ toast('Preencha valor e data','err'); return; }
  const insc=inscricoes.find(i=>i.id===id);
  const pagamentos=[...(insc.pagamentos||[]),{valor,data,obs}];
  const valorPago=pagamentos.reduce((s,p)=>s+p.valor,0);
  const falta=Math.max(0,vTotal-valorPago);
  const novoStatus=falta===0?'pago_pix':insc.status;
  await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).update({pagamentos,valorPago,status:novoStatus});
  toast(`${fmtBRL(valor)} lançado!${falta===0?' Quitado! ✅':' Falta: '+fmtBRL(falta)}`);
  closeModal();
  setTimeout(()=>openParcelas(id),300);
}

async function removerParcela(id,idx){
  if(!confirm('Remover este pagamento?')) return;
  const insc=inscricoes.find(i=>i.id===id);
  const pagamentos=(insc.pagamentos||[]).filter((_,i)=>i!==idx);
  const valorPago=pagamentos.reduce((s,p)=>s+p.valor,0);
  await db.collection('cursos').doc(cursoAtivoId).collection('inscricoes').doc(id).update({pagamentos,valorPago});
  toast('Removido'); closeModal(); setTimeout(()=>openParcelas(id),300);
}

// ── EXCEL ──
function exportarExcel(){
  const header=['Nome','Email','Telefone','Instagram','Perfil','Faculdade','Forma Pgto','Fidelidade','Valor Bruto (R$)','Valor Liquido Cartao (R$)','Valor Pago (R$)','Falta (R$)','Status','Parcelas Pagas'];
  const rows=inscricoes.map(i=>{
    const vT=i.valorFinal||0,vP=i.valorPago||0,vL=i.valorLiquido!==undefined?parseFloat(i.valorLiquido).toFixed(2):'';
    const parcelas=(i.pagamentos||[]).map((p,idx)=>`P${idx+1}: R$${p.valor} em ${p.data}`).join(' | ');
    return [i.nome||'',i.email||'',i.telefone||'',i.instagram||'',i.perfil||'',i.faculdade||'',i.formaPagamento||'',i.fidelidade==='sim'?'Sim':'Não',vT.toFixed(2),vL,vP.toFixed(2),Math.max(0,vT-vP).toFixed(2),statusLabel(i.status),parcelas];
  });
  // Tab-separated for better Excel compatibility
  const tsv='\uFEFF'+[header,...rows].map(r=>r.map(v=>String(v).replace(/\t/g,' ')).join('\t')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([tsv],{type:'text/tab-separated-values;charset=utf-8;'}));
  a.download=`inscricoes_${cursoAtivo?.nome||'curso'}_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.tsv`;
  a.click(); toast('Planilha gerada! Abra com Excel ou Google Sheets.');
}

<\/script></body></html>`;

      <div><h1>Gastos do Evento</h1><p>${gastos.length} lançamento(s)</p></div>
      <div class="hdr-actions"><span class="total-tag">Total: ${fmtBRL(total)}</span><button class="btn btn-primary" onclick="openAddGasto()">➕ Novo Gasto</button></div>
    </div>
    ${porCat.length===0?'<div class="empty"><div class="ico">💸</div><p>Nenhum gasto registrado.</p></div>':`<div class="gastos-grid">${porCat.map(({cat,items})=>{const ct=items.reduce((s,g)=>s+(g.valor||0),0);return`<div class="gasto-cat"><div class="gasto-cat-hdr"><span style="font-weight:600;font-size:14px">${cat}</span><span style="font-weight:700;color:var(--accent);font-family:'Syne',sans-serif">${fmtBRL(ct)}</span></div>${items.map(g=>`<div class="gasto-item"><span>${g.descricao}</span><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:700;font-family:'Syne',sans-serif;font-size:13px">${fmtBRL(g.valor)}</span><button class="ico-btn" onclick="deleteGasto('${g.id}')">🗑️</button></div></div>`).join('')}</div>`;}).join('')}</div>`}
  </div>`;
}
function openAddGasto(){
  document.body.insertAdjacentHTML('beforeend',`
  <div class="overlay" onclick="closeIfOverlay(event)">
    <div class="modal">
      <div class="modal-header"><h2>Novo Gasto</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="form-grid">
        <div class="field full"><label>Descrição *</label><input id="gf-desc" placeholder="Ex: Aluguel de sala"/></div>
        <div class="field"><label>Categoria</label><select id="gf-cat">${CATS_GASTO.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Valor (R$) *</label><input id="gf-val" placeholder="0,00"/></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveGasto()">Salvar</button>
      </div>
    </div>
  </div>`);
}
async function saveGasto(){
  const desc=document.getElementById('gf-desc').value.trim(), val=parseFloat(document.getElementById('gf-val').value.replace(',','.'));
  if(!desc||isNaN(val)){ toast('Preencha descrição e valor','err'); return; }
  try{ await db.collection('cursos').doc(cursoAtivoId).collection('gastos').add({descricao:desc,categoria:document.getElementById('gf-cat').value,valor:val,criadoEm:firebase.firestore.FieldValue.serverTimestamp()}); toast('Gasto salvo!'); }
  catch(e){ toast('Erro ao salvar','err'); }
  closeModal();
}
async function deleteGasto(id){ if(!confirm('Remover?')) return; await db.collection('cursos').doc(cursoAtivoId).collection('gastos').doc(id).delete(); reloadGastos(renderGastos); toast('Removido'); }

function getValor(){
  const c=pubCurso||{}, fid=pubFidelidade==='sim';
  if(pubPgto==='avista')   return parseFloat(fid?c.fAvista:c.vAvista)||0;
  if(pubPgto==='pixparc')  return parseFloat(fid?c.fPix3x:c.vPix3x)||0;
  if(pubPgto==='cartao1')  return parseFloat(fid?c.fAvista:c.vAvista)||0; // mesmo valor do pix à vista
  if(pubPgto==='cartao2')  return parseFloat(fid?c.fCartao:c.vCartao)||0;
  return 0;
}
function getLinkCartao(){
  const c=pubCurso||{}, fid=pubFidelidade==='sim';
  if(pubPgto==='cartao1') return fid?(c.cartao1LinkF||c.cartao1Link):c.cartao1Link;
  if(pubPgto==='cartao2') return fid?c.linkCartaoFid:c.linkCartao;
  return '';
}

        </div>
      </div>

      <div id="bloco-pix3x" style="display:none;margin:16px 0;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:16px">
        <p style="font-weight:700;font-size:14px;margin-bottom:10px">⚠️ Regras do parcelamento no PIX</p>
        ${regrasPix.map(r=>`<p style="font-size:13px;color:var(--text2);margin-bottom:4px">${r}</p>`).join('')}
        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:12px;cursor:pointer;font-size:13px">
          <input type="checkbox" id="aceite-pix" onchange="pubAceitePix=this.checked" style="accent-color:var(--accent);width:16px;height:16px;margin-top:2px;flex-shrink:0">
          <span>Estou ciente e aceito as condições do parcelamento no PIX.</span>
        </label>
      </div>

      <div style="margin:16px 0;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:16px">
        <p style="font-weight:700;font-size:14px;margin-bottom:10px">📋 Política de Cancelamento</p>
        ${regrasCancel.map(r=>`<p style="font-size:13px;color:var(--text2);margin-bottom:4px">${r}</p>`).join('')}
        <label style="display:flex;align-items:flex-start;gap:8px;margin-top:12px;cursor:pointer;font-size:13px">
          <input type="checkbox" id="aceite-cancel" onchange="pubAceiteCancel=this.checked" style="accent-color:var(--accent);width:16px;height:16px;margin-top:2px;flex-shrink:0">
          <span>Estou ciente e aceito a política de cancelamento.</span>
        </label>
      </div>

      <div style="background:var(--bg3);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--text2);margin-bottom:16px">⚠️ A inscrição só terá validade mediante pagamento em até <strong>48 horas</strong>.</div>
      <button class="btn btn-primary btn-full" id="pub-submit-btn" onclick="submitInscricao()">Confirmar Inscrição</button>
    </div>
  </div>`;
}

function selectPgtoPub(el,val){ pubPgto=val; document.querySelectorAll('#radio-pgto .radio-opt').forEach(r=>r.classList.remove('selected')); el.classList.add('selected'); const bp=document.getElementById('bloco-pix3x'); if(bp) bp.style.display=val==='pixparc'?'block':'none'; document.getElementById('valor-preview').innerHTML=`💰 Valor: ${fmtBRL(getValor())}`; }
function selectFid(el,val){ pubFidelidade=val; document.querySelectorAll('#radio-fid .radio-opt').forEach(r=>r.classList.remove('selected')); el.classList.add('selected'); const a=document.getElementById('fid-aviso'); if(a) a.style.display=val==='sim'?'block':'none'; document.getElementById('valor-preview').innerHTML=`💰 Valor: ${fmtBRL(getValor())}`; }

async function submitInscricao(){
  const nome=document.getElementById('pf-nome').value.trim(), email=document.getElementById('pf-email').value.trim(), tel=document.getElementById('pf-tel').value.trim();
  if(!nome||!email||!tel){ toast('Preencha nome, email e telefone','err'); return; }
  if(!/\S+@\S+\.\S+/.test(email)){ toast('Email inválido','err'); return; }
  if(pubPgto==='pix3x'&&!pubAceitePix){ toast('Aceite as regras do parcelamento no PIX','err'); return; }
  if(!pubAceiteCancel){ toast('Aceite a política de cancelamento','err'); return; }
  const btn=document.getElementById('pub-submit-btn'); btn.textContent='Enviando...'; btn.disabled=true;
  const c2=pubCurso||{};
  const pgtoLabel={
    avista:'PIX à vista',
    pixparc:`PIX parcelado (${c2.pixN||3}x)`,
    cartao1:`Cartão de crédito (até ${c2.cartao1N||3}x)`,
    cartao2:`Cartão de crédito (até ${c2.cartao2N||10}x)`
  }[pubPgto]||pubPgto;
  const valorFinal=getValor();
  try{
    const ref=await db.collection('cursos').doc(pubCursoId).collection('inscricoes').add({
      nome,email,telefone:tel,
      instagram:document.getElementById('pf-insta').value.trim(),
      perfil:document.getElementById('pf-perfil').value,
      faculdade:document.getElementById('pf-fac').value.trim(),
      formaPagamento:pgtoLabel, fidelidade:pubFidelidade, valorFinal,
      status:'aguard_confirm', criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    pubInscId=ref.id; pubNome=nome;
    await db.collection('cursos').doc(pubCursoId).collection('notificacoes').add({
      tipo:'nova', nomeAluno:nome, detalhe:`${pgtoLabel} · ${fmtBRL(valorFinal)}${pubFidelidade==='sim'?' · 🤝 Fidelidade':''}`,
      inscricaoId:ref.id, lida:false, criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    sendEmail(EJ_TMPL_INSC,{nome_aluno:nome,email_aluno:email,telefone:tel,forma_pagamento:pgtoLabel,fidelidade:pubFidelidade==='sim'?'Sim':'Não',valor:fmtBRL(valorFinal)});
    renderPublicPagamento();
  } catch(e){ console.error(e); toast('Erro ao enviar. Tente novamente.','err'); btn.textContent='Confirmar Inscrição'; btn.disabled=false; }
}

function renderPublicPagamento(){
  const c=pubCurso||{}, fid=pubFidelidade==='sim', isCartao=pubPgto==='cartao1'||pubPgto==='cartao2', isPix3x=pubPgto==='pixparc';
  const linkCartao=getLinkCartao(), valorFinal=getValor();
  document.getElementById('public-page').innerHTML=`
  <div class="confirm-card fade-in">
    <div class="confirm-ico">✅</div>
    <h1>Inscrição Recebida!</h1>
    <p style="color:var(--text2);font-size:15px;margin-bottom:6px">Olá, <strong>${pubNome}</strong>! Sua inscrição em <strong>${c.nome||'nosso curso'}</strong> foi registrada.</p>
    ${fid?`<p style="font-size:13px;color:#e2d9ff;margin-top:4px">🤝 Plano Fidelidade — será verificado manualmente</p>`:''}
    <p style="margin-top:14px;font-weight:600;color:var(--text)">Finalize o pagamento para confirmar sua vaga:</p>
    ${!isCartao?`
    <div class="pix-box">
      <div class="pix-box-hdr"><span style="background:var(--green);color:#fff;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:800">PIX</span> Pagamento via PIX</div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:6px">Chave PIX:</p>
      <div class="pix-key-row"><code>${c.chavePix||'Não configurada'}</code><button class="ico-btn" onclick="navigator.clipboard.writeText('${c.chavePix||''}').then(()=>toast('Copiado!'))">📋</button></div>
      ${c.nomePix?`<p style="font-size:13px;color:var(--text2);margin-top:4px">Titular: <strong>${c.nomePix}</strong></p>`:''}
      <p style="font-size:15px;font-weight:700;color:var(--green);margin-top:10px">Valor: ${fmtBRL(valorFinal)}</p>
      ${isPix3x&&c.pixP1?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(16,185,129,.2)"><p style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px">PARCELAS:</p>${c.pixP1?`<p style="font-size:13px;margin-bottom:3px">• 1ª: <strong>${fmtBRL(fid?(c.pixP1*(c.fPix3x/c.vPix3x)):c.pixP1)}</strong> — no ato da inscrição</p>`:''} ${c.pixP2?`<p style="font-size:13px;margin-bottom:3px">• 2ª: <strong>${fmtBRL(fid?(c.pixP2*(c.fPix3x/c.vPix3x)):c.pixP2)}</strong></p>`:''} ${c.pixP3?`<p style="font-size:13px">• 3ª: <strong>${fmtBRL(fid?(c.pixP3*(c.fPix3x/c.vPix3x)):c.pixP3)}</strong></p>`:''}</div>`:''}
    </div>`:`
    <div class="cartao-box">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px">💳 Pagamento via Cartão — até 10x</div>
      <p style="font-size:15px;font-weight:700;color:var(--blue);margin-bottom:12px">Valor: ${fmtBRL(valorFinal)}</p>
      ${linkCartao?`<a href="${linkCartao}" target="_blank" class="btn btn-primary btn-full" style="margin-top:0">Clique aqui para pagar no cartão</a>`:'<p style="color:var(--text2);font-size:14px">Entre em contato para o pagamento.</p>'}
    </div>`}
    <div class="aviso-pgto-box">
      <h3>📤 Após realizar o pagamento</h3>
      <p style="font-size:14px;color:var(--text2);margin-bottom:14px">Clique no botão abaixo para nos avisar que o pagamento foi efetuado.</p>
      <button onclick="irParaAvisar('${pubInscId}')" class="btn btn-green btn-full" style="margin-top:0">✅ Avisar que paguei</button>
      <p style="font-size:13px;color:var(--text2);margin-top:12px;text-align:center">Ou pelo direct do Instagram: <a href="https://instagram.com/fccursos" target="_blank" style="color:var(--accent);font-weight:700">@fccursos</a></p>
    </div>
    ${(c.data||c.local)?`<div class="info-box">${c.data?`<p>📅 <strong>${c.data}</strong></p>`:''} ${c.local?`<p>📍 <strong>${c.local}</strong></p>`:''}</div>`:''}
    <div style="margin-top:16px;padding:14px;background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.2);border-radius:10px;font-size:13px;color:var(--text2);text-align:center">
      Dúvidas? <a href="https://instagram.com/fccursos" target="_blank" style="color:var(--accent);font-weight:700">@fccursos</a>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════════════
// AVISAR PAGAMENTO
// ══════════════════════════════════════════════════════
function irParaAvisar(inscId){
  hide('public-page'); show('public-page');
  const parts = hashNow.split('/');
  const cId = parts[2] || pubCursoId;
  db.collection('cursos').doc(cId).collection('inscricoes').doc(inscId).get().then(snap=>{
    if(!snap.exists){ document.getElementById('public-page').innerHTML='<div style="padding:40px;text-align:center;color:var(--text2)">Inscrição não encontrada.</div>'; return; }
    renderAvisarForm(inscId, snap.data(), cId);
  });
}

function showAvisarPage(){
  hide('loading-screen'); show('public-page');
  const parts = hashNow.replace('#/avisar/','').split('/');
  const cId = parts[0], inscId = parts[1];
  if(!cId||!inscId){ document.getElementById('public-page').innerHTML='<div style="padding:40px;text-align:center;color:var(--text2)">Link inválido.</div>'; return; }
  db.collection('cursos').doc(cId).collection('inscricoes').doc(inscId).get().then(snap=>{
    if(!snap.exists){ document.getElementById('public-page').innerHTML='<div style="padding:40px;text-align:center;color:var(--text2)">Inscrição não encontrada.</div>'; return; }
    renderAvisarForm(inscId, snap.data(), cId);
  });
}

function renderAvisarForm(inscId, insc, cId){
  if(insc.status==='pago_pix'||insc.status==='pago_cartao'){
    document.getElementById('public-page').innerHTML=`<div class="confirm-card fade-in"><div class="confirm-ico">✅</div><h1>Pagamento já confirmado!</h1><p style="color:var(--text2)">Olá, <strong>${insc.nome}</strong>! Sua vaga está garantida!</p><div style="margin-top:16px;padding:14px;background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.2);border-radius:10px;font-size:13px;color:var(--text2);text-align:center">Dúvidas? <a href="https://instagram.com/fccursos" target="_blank" style="color:var(--accent);font-weight:700">@fccursos</a></div></div>`;
    return;
  }
  document.getElementById('public-page').innerHTML=`
  <div class="confirm-card fade-in">
    <div class="confirm-ico">💰</div>
    <h1>Aviso de Pagamento</h1>
    <p style="color:var(--text2);font-size:15px;margin-bottom:6px">Olá, <strong>${insc.nome}</strong>! Informe os dados do pagamento.</p>
    <div style="background:var(--bg3);border-radius:10px;padding:16px;margin:16px 0;text-align:left">
      <p style="font-size:13px;color:var(--text2)">Forma: <strong style="color:var(--text)">${insc.formaPagamento}</strong></p>
      <p style="font-size:13px;color:var(--text2);margin-top:4px">Valor: <strong style="color:var(--text)">${fmtBRL(insc.valorFinal)}</strong></p>
    </div>
    <div class="form-grid" style="margin-top:16px;text-align:left">
      <div class="field full"><label>Observação (opcional)</label><textarea id="av-obs" placeholder="Ex: Paguei a 1ª parcela de R$150 hoje..." rows="3"></textarea></div>
    </div>
    <button class="btn btn-primary btn-full" id="av-btn" onclick="enviarAviso('${inscId}','${insc.nome}','${insc.formaPagamento}',${insc.valorFinal||0},'${cId}')">📤 Enviar aviso de pagamento</button>
    <p style="font-size:12px;color:var(--text2);margin-top:12px">Após o aviso, confirmaremos e sua vaga será garantida.</p>
  </div>`;
}

async function enviarAviso(inscId,nome,pgto,valor,cId){
  const obs=document.getElementById('av-obs').value.trim();
  const btn=document.getElementById('av-btn'); btn.textContent='Enviando...'; btn.disabled=true;
  try{
    await db.collection('cursos').doc(cId).collection('inscricoes').doc(inscId).update({status:'aguard_confirm'});
    await db.collection('cursos').doc(cId).collection('notificacoes').add({
      tipo:'pagamento', nomeAluno:nome, detalhe:`${pgto} · ${fmtBRL(valor)}${obs?' · Obs: '+obs:''}`,
      inscricaoId:inscId, lida:false, criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    sendEmail(EJ_TMPL_PGTO,{nome_aluno:nome,forma_pagamento:pgto,valor:fmtBRL(valor),observacao:obs||'Nenhuma'});
    document.getElementById('public-page').innerHTML=`<div class="confirm-card fade-in"><div class="confirm-ico">🎉</div><h1>Aviso enviado!</h1><p style="color:var(--text2)">Obrigado, <strong>${nome}</strong>! Confirmaremos sua vaga em breve.</p><div style="margin-top:20px;padding:14px;background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.2);border-radius:10px;font-size:13px;color:var(--text2);text-align:center">Dúvidas? <a href="https://instagram.com/fccursos" target="_blank" style="color:var(--accent);font-weight:700">@fccursos</a></div></div>`;
    window.scrollTo(0,0);
  } catch(e){ toast('Erro ao enviar. Tente novamente.','err'); btn.textContent='📤 Enviar aviso de pagamento'; btn.disabled=false; }
}

// SW
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(e=>console.log('SW:',e)); });
}
</script>
</body>
